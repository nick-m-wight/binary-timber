# Pin patched versions of transitive deps flagged by `pnpm audit` (see docs/SCOPING.md §4).
#   sharp   >=0.35.0  — libvips CVEs (via next)
#   postcss >=8.5.18  — source-map path traversal (via next)
overrides:
  sharp: ">=0.35.0"
  postcss: ">=8.5.18"

# Native build scripts pnpm is allowed to run on install. Reviewed and approved
# deliberately (deny-by-default is pnpm's behavior; see docs/SCOPING.md §4 supply chain).
#   sharp         — image processing used by Next.js
#   unrs-resolver — native module resolver used by eslint-config-next
allowBuilds:
  sharp: true
  unrs-resolver: true
